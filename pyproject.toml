[project]
name = "rag-llmops-demo"
version = "0.1.0"
description = "End-to-end LLMOps demo for a RAG chatbot agent on Databricks"
requires-python = ">=3.10"
dependencies = [
    "mlflow>=3.1",
    "databricks-sdk",
    "databricks-agents",
    "databricks-vectorsearch",
    "databricks-openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
